{#<!-- tournoi/templates/tournoi/top10_list.html -->#}
{% for label, matches in top10.items %}
    <h2>Top 10 {{ category[label] }}</h2>
<table>
    <thead>
        <tr><th>Match</th><th>Nombre d'échiquiers</th><th>Résultat</th></tr>
    </thead>
    <tbody>
{% for match in matches %}
    <tr>
        <td><a href="{{match.url}}"{{ match.name }}</a></td>
        <td>{{ match.num_boards }}</td>
        <td>{{ match.score_team1 }} - {{ match.score_team2 }}</td>
    </tr>
{% empty %}
    <tr><td colspan="2">Aucun enregistrement trouvé.</td></tr>
{% endfor %}
    </tbody>
</table>
